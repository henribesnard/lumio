name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff mypy
      - run: ruff check .
      - run: ruff format --check .

  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ".[dev]" aiosqlite
      - run: python -m pytest -x -q --tb=short
        env:
          DATABASE_URL: "sqlite+aiosqlite:///"
          DATABASE_URL_SYNC: "sqlite:///"
          SESSION_SECRET: "ci-test-secret-at-least-32-characters"
          PUBLIC_URL: "http://testserver"

  backend-test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lumio
          POSTGRES_PASSWORD: lumio_ci
          POSTGRES_DB: lumio
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ".[dev]"
      - name: Run Alembic migrations
        run: alembic upgrade head
        env:
          DATABASE_URL_SYNC: "postgresql://lumio:lumio_ci@localhost:5432/lumio"
      - name: Run tests on PostgreSQL
        run: python -m pytest -x -q --tb=short
        env:
          DATABASE_URL: "postgresql+asyncpg://lumio:lumio_ci@localhost:5432/lumio"
          DATABASE_URL_SYNC: "postgresql://lumio:lumio_ci@localhost:5432/lumio"
          SESSION_SECRET: "ci-test-secret-at-least-32-characters"
          PUBLIC_URL: "http://testserver"

  frontend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npx prettier --check src/

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run build
