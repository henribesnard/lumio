[project]
name = "lumio-backend"
version = "0.1.0"
description = "Lumio — Tuteur IA pour enfants (backend)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.30,<1",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.14,<2",
    "argon2-cffi>=23,<24",
    "itsdangerous>=2.2,<3",
    "pyotp>=2.9,<3",
    "langgraph>=0.2,<1",
    "langchain-mistralai>=0.2,<1",
    "langgraph-checkpoint-postgres>=2,<3",
    "httpx>=0.27,<1",
    "pyyaml>=6,<7",
    "python-multipart>=0.0.12,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
    "httpx>=0.27,<1",
    "ruff>=0.8,<1",
    "mypy>=1.13,<2",
    "sqlalchemy[mypy]>=2.0,<3",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "S", "B", "A", "C4", "SIM"]
ignore = ["S101", "S106", "B008"]  # Allow assert in tests, hardcoded passwords in examples, FastAPI Depends()

[tool.mypy]
python_version = "3.12"
plugins = ["sqlalchemy.ext.mypy.plugin"]
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.setuptools.packages.find]
include = ["app*"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
